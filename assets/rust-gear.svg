<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" role="img" aria-label="Rust gear logo">
  <!-- Logo rendered in white so it is visible against the orange header -->
  <circle fill="none" stroke="#ffffff" stroke-width="8" cx="72" cy="72" r="56"/>
  <g fill="#ffffff">
    <!-- Gear teeth (8 teeth) -->
    <rect x="68" y="8" width="8" height="14" rx="2"/>
    <rect x="68" y="122" width="8" height="14" rx="2"/>
    <rect x="8" y="68" width="14" height="8" rx="2"/>
    <rect x="122" y="68" width="14" height="8" rx="2"/>
    <rect x="28.5" y="21.5" width="8" height="14" rx="2" transform="rotate(45 32.5 28.5)"/>
    <rect x="107.5" y="108.5" width="8" height="14" rx="2" transform="rotate(45 111.5 115.5)"/>
    <rect x="21.5" y="100.5" width="8" height="14" rx="2" transform="rotate(-45 25.5 107.5)"/>
    <rect x="108.5" y="22.5" width="8" height="14" rx="2" transform="rotate(-45 112.5 29.5)"/>
  </g>
  <!-- Inner hub -->
  <circle fill="#ffffff" cx="72" cy="72" r="20"/>
  <circle fill="#CE422B" cx="72" cy="72" r="12"/>
</svg>
