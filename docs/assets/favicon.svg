    <rect x="122" y="68" width="16" height="8" rx="2"/>
    <rect x="27" y="20"  width="8" height="16" rx="2" transform="rotate(45 31 28)"/>
    <rect x="109" y="108" width="8" height="16" rx="2" transform="rotate(45 113 116)"/>
    <rect x="20" y="100"  width="8" height="16" rx="2" transform="rotate(-45 24 108)"/>
